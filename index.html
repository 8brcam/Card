<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cueverse Premium Player Card Showcase</title>
    <style>
        :root {
            --bg-color: #03050a;
            --panel-bg: #0f172a;
            --text-color: #f8fafc;
            
            /* Enhanced Hyper-Reflective Metallic Gradients */
            --fc-gold-base: linear-gradient(145deg, #ffe57f 0%, #dca021 45%, #fcd34d 55%, #603b01 100%);
            --fc-silver-base: linear-gradient(145deg, #ffffff 0%, #94a3b8 45%, #cbd5e1 55%, #1e293b 100%);
            --fc-bronze-base: linear-gradient(145deg, #ffedd5 0%, #b45309 45%, #fed7aa 55%, #431407 100%);
            
            /* Dynamic Theme Back-Glow Shadows */
            --gold-glow: 0 0 35px rgba(220, 160, 33, 0.4), 0 0 15px rgba(220, 160, 33, 0.2);
            --silver-glow: 0 0 35px rgba(148, 163, 184, 0.35), 0 0 15px rgba(148, 163, 184, 0.15);
            --bronze-glow: 0 0 35px rgba(180, 83, 9, 0.4), 0 0 15px rgba(180, 83, 9, 0.2);
        }

        body {
            font-family: "Arial Black", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            background-color: var(--panel-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 880px;
            width: auto;
            transition: all 0.3s ease;
        }

        /* --- THE PREMIUM SHIELD ARCHITECTURE --- */
        .card-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fut-card {
            position: relative;
            width: 275px;
            height: 395px;
            background: var(--fc-gold-base);
            color: #080602;
            
            /* High-contrast multi-layered drop shadow and neon back-glow combo */
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), var(--gold-glow);
            
            display: flex;
            flex-direction: column;
            padding: 4px;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            
            /* Refined, modern shield geometry shape cutout */
            clip-path: polygon(0% 12%, 18% 4%, 50% 0%, 82% 4%, 100% 12%, 100% 76%, 50% 100%, 0% 76%);
        }

        /* Interactive subtle tilt hover zoom effect */
        .fut-card:hover {
            transform: translateY(-8px) scale(1.02);
        }

        /* Holographic front sheen line highlight layer */
        .fut-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.22) 47%, rgba(255,255,255,0.05) 50%, transparent 58%);
            pointer-events: none;
            z-index: 3;
            transform: rotate(0deg);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            
            /* Elegant frosted inset layer inside the border */
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            
            clip-path: polygon(0% 12%, 18% 4%, 50% 0%, 82% 4%, 100% 12%, 100% 76%, 50% 100%, 0% 76%);
            display: flex;
            flex-direction: column;
            padding: 28px 10px 15px 10px;
            box-sizing: border-box;
            z-index: 2;
        }

        /* Top Module: Vertical Left Control Deck & Player Silhouette Portrait */
        .card-top {
            display: flex;
            height: 155px;
            width: 100%;
            margin-top: 10px;
        }

        .badge-ovr {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 25%;
            gap: 2px;
            padding-top: 5px;
            border-right: 1px solid rgba(0, 0, 0, 0.12);
        }

        .ovr-txt {
            font-size: 46px;
            font-weight: 900;
            line-height: 38px;
            letter-spacing: -2px;
            color: #000;
            text-shadow: 0 2px 4px rgba(255,255,255,0.3);
        }

        .pos-txt {
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            color: #1a1303;
            letter-spacing: 0.5px;
        }

        .flag-img {
            width: 26px;
            height: 16px;
            object-fit: cover;
            border: 1px solid rgba(0, 0, 0, 0.3);
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
            margin: 4px 0;
            border-radius: 2px;
        }

        .club-icon {
            width: 22px;
            height: 22px;
            opacity: 0.9;
            margin-top: 2px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .avatar-placeholder {
            width: 75%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            position: relative;
        }

        /* High-contrast drop shadow on portrait image silhouettes */
        .avatar-placeholder svg, .avatar-placeholder img {
            width: 90%;
            height: auto;
            max-height: 135px;
            object-fit: contain;
            object-position: bottom center;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
        }

        .player-name {
            text-align: center;
            font-size: 21px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 3px 0;
            margin: 10px 10px 15px 10px;
            letter-spacing: -0.5px;
            color: #000;
            text-shadow: 0 1px 2px rgba(255,255,255,0.2);
            border-bottom: 1px solid rgba(0, 0, 0, 0.15);
        }

        /* Single Straight Horizontal Row Stat Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            padding: 0 2px;
            margin-top: 6px;
            justify-content: center;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            border-right: 1px solid rgba(0, 0, 0, 0.1);
        }

        .stat-item:last-child {
            border-right: none;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 800;
            color: #241a05;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-val {
            font-size: 18px;
            font-weight: 900;
            color: #000;
        }

        /* --- SECRET CONTROLS PANEL --- */
        .controls-panel {
            display: none;
            flex-direction: column;
            gap: 14px;
            width: 320px;
            border-left: 1px solid #334155;
            padding-left: 30px;
        }

        h2 {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin-top: 0;
            font-size: 24px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }

        input[type="text"], select, textarea {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #020617;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .btn-upload {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn-upload:hover {
            opacity: 0.9;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #dca021;
            cursor: pointer;
        }

        .slider-val {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            width: 30px;
            text-align: right;
            font-weight: 700;
            font-size: 15px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .controls-panel {
                width: 100%;
                border-left: none;
                border-top: 1px solid #334155;
                padding-left: 0;
                padding-top: 20px;
            }
        }
    </style>
<body>

<div class="container">
    <!-- Single Horizontal Row Card Container -->
    <div class="card-container">
        <div class="fut-card" id="cardElement">
            <div class="card-inner">
                <div class="card-top">
                    <!-- Left-Aligned Control Deck Header Column -->
                    <div class="badge-ovr">
                        <span class="ovr-txt" id="cardOvr">85</span>
                        <span class="pos-txt">CUE</span>
                        <!-- Dynamic Flag Image Slot -->
                        <img src="https://flagcdn.com" class="flag-img" id="cardFlag" alt="Country Flag">
                        <!-- Custom Game Badge Emblem -->
                        <svg class="club-icon" viewBox="0 0 100 100" xmlns="http://w3.org">
                            <circle cx="50" cy="50" r="45" fill="#000"/>
                            <circle cx="50" cy="50" r="20" fill="#fff"/>
                        </svg>
                    </div>
                    <!-- Right Profile Silhouette Canvas -->
                    <div class="avatar-placeholder" id="avatarPlaceholder">
                        <svg viewBox="0 0 100 100" xmlns="http://w3.org">
                            <path d="M50,90 C30,90 20,75 20,60 C20,40 30,20 50,20 C70,20 80,40 80,60 C80,75 70,90 50,90 Z" fill="#111" opacity="0.85"/>
                            <circle cx="50" cy="40" r="18" fill="#111" opacity="0.85"/>
                        </svg>
                    </div>
                </div>
                
                <!-- Player Name Core Banner -->
                <div class="player-name" id="cardName">PLAYER NAME</div>
                
                <!-- Single Straight Horizontal Row (No Vertical Stacking) -->
                <div class="stats-grid">
                    <div class="stat-item"><span class="stat-label">AGG</span><span class="stat-val" id="cardAgg">85</span></div>
                    <div class="stat-item"><span class="stat-label">CTR</span><span class="stat-val" id="cardCtr">85</span></div>
                    <div class="stat-item"><span class="stat-label">SEL</span><span class="stat-val" id="cardSel">85</span></div>
                    <div class="stat-item"><span class="stat-label">POT</span><span class="stat-val" id="cardPot">85</span></div>
                    <div class="stat-item"><span class="stat-label">SAF</span><span class="stat-val" id="cardSaf">85</span></div>
                    <div class="stat-item"><span class="stat-label">TEM</span><span class="stat-val" id="cardTem">85</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Generator Interface Panels (Secret Admin Section) -->
    <div class="controls-panel" id="adminPanel">
        <h2>Cueverse Card Editor</h2>
        
        <div class="input-group">
            <label for="nameInput">Player Name</label>
            <input type="text" id="nameInput" value="PLAYER NAME" maxlength="14">
        </div>

        <div class="input-group">
            <label>Player Portrait Picture</label>
            <button class="btn-upload" style="background-color: #2563eb;" onclick="document.getElementById('imageLoader').click()">Choose Image File</button>
            <input type="file" id="imageLoader" accept="image/*" style="display: none;">
        </div>

        <div class="input-group">
            <label for="countryInput">Player Nationality</label>
            <select id="countryInput">
                <option value="gb">United Kingdom</option>
                <option value="us">United States</option>
                <option value="br">Brazil</option>
                <option value="de">Germany</option>
                <option value="fr">France</option>
                <option value="es">Spain</option>
                <option value="cn">China</option>
                <option value="jp">Japan</option>
                <option value="ca">Canada</option>
                <option value="au">Australia</option>
            </select>
        </div>

        <div class="input-group">
            <label for="tierInput">Card Tier Theme</label>
            <select id="tierInput">
                <option value="gold">Gold Premium</option>
                <option value="silver">Silver Premium</option>
                <option value="bronze">Bronze Premium</option>
            </select>
        </div>

        <!-- Metric Sliders -->
        <div class="input-group">
            <label for="aggInput">Aggression (AGG)</label>
            <div class="slider-row">
                <input type="range" id="aggInput" min="10" max="99" value="85">
                <span class="slider-val" id="aggVal">85</span>
            </div>
        </div>

        <div class="input-group">
            <label for="ctrInput">Control (CTR)</label>
            <div class="slider-row">
                <input type="range" id="ctrInput" min="10" max="99" value="85">
                <span class="slider-val" id="ctrVal">85</span>
            </div>
        </div>

        <div class="input-group">
            <label for="selInput">Shot Selection (SEL)</label>
            <div class="slider-row">
                <input type="range" id="selInput" min="10" max="99" value="85">
                <span class="slider-val" id="selVal">85</span>
            </div>
        </div>

        <div class="input-group">
            <label for="potInput">Potting (POT)</label>
            <div class="slider-row">
                <input type="range" id="potInput" min="10" max="99" value="85">
                <span class="slider-val" id="potVal">85</span>
            </div>
        </div>

        <div class="input-group">
            <label for="safInput">Safety (SAF)</label>
            <div class="slider-row">
                <input type="range" id="safInput" min="10" max="99" value="85">
                <span class="slider-val" id="safVal">85</span>
            </div>
        </div>

        <div class="input-group">
            <label for="temInput">Temperament (TEM)</label>
            <div class="slider-row">
                <input type="range" id="temInput" min="10" max="99" value="85">
                <span class="slider-val" id="temVal">85</span>
            </div>
        </div>

        <!-- Export Deployment Block -->
        <div class="input-group" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 15px;">
            <button class="btn-upload" style="background-color: #10b981;" onclick="generateBakedCode()">Get Deployment Code</button>
        </div>
        
        <!-- Output Code Box Window Display -->
        <div class="input-group" id="outputArea" style="display: none; margin-top: 10px;">
            <label>Copy this text and paste it to your index.html file:</label>
            <textarea id="codeBox" rows="6" style="font-family: monospace; font-size: 11px;" readonly></textarea>
        </div>
    </div>
</div>
<script>
    // Map input components
    const nameInput = document.getElementById('nameInput');
    const countryInput = document.getElementById('countryInput');
    const tierInput = document.getElementById('tierInput');
    const aggInput = document.getElementById('aggInput');
    const ctrInput = document.getElementById('ctrInput');
    const selInput = document.getElementById('selInput');
    const potInput = document.getElementById('potInput');
    const safInput = document.getElementById('safInput');
    const temInput = document.getElementById('temInput');
    const imageLoader = document.getElementById('imageLoader');
    const adminPanel = document.getElementById('adminPanel');

    // Map card display items
    const cardName = document.getElementById('cardName');
    const cardFlag = document.getElementById('cardFlag');
    const cardElement = document.getElementById('cardElement');
    const avatarContainer = document.getElementById('avatarPlaceholder');
    
    const cardOvr = document.getElementById('cardOvr');
    const cardAgg = document.getElementById('cardAgg');
    const cardCtr = document.getElementById('cardCtr');
    const cardSel = document.getElementById('cardSel');
    const cardPot = document.getElementById('cardPot');
    const cardSaf = document.getElementById('cardSaf');
    const cardTem = document.getElementById('cardTem');

    const aggVal = document.getElementById('aggVal');
    const ctrVal = document.getElementById('ctrVal');
    const selVal = document.getElementById('selVal');
    const potVal = document.getElementById('potVal');
    const safVal = document.getElementById('safVal');
    const temVal = document.getElementById('temVal');

    // --- SECRET URL VISIBILITY ENGINE ---
    function checkUrlPermissions() {
        const urlParams = new URLSearchParams(window.location.search);
        // If your link has ?edit=true, show the panel. Otherwise leave it hidden.
        if (urlParams.get('edit') === 'true') {
            adminPanel.style.display = 'flex';
        } else {
            adminPanel.style.display = 'none';
        }
    }

    // Image Upload Engine Logic
    imageLoader.addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            avatarContainer.innerHTML = '';
            const img = document.createElement('img');
            img.src = event.target.result;
            avatarContainer.appendChild(img);
        }
        if(e.target.files && e.target.files[0]) {
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    // Live mathematical calculation mapping
    function updateOverall() {
        const agg = parseInt(aggInput.value) || 0;
        const ctr = parseInt(ctrInput.value) || 0;
        const sel = parseInt(selInput.value) || 0;
        const pot = parseInt(potInput.value) || 0;
        const saf = parseInt(safInput.value) || 0;
        const tem = parseInt(temInput.value) || 0;
        
        const average = Math.round((agg + ctr + sel + pot + saf + tem) / 6);
        cardOvr.textContent = average;
    }
    // Main layout renderer pipeline with Dynamic Neon Shadow Control
    function updateCard() {
        cardName.textContent = nameInput.value || "PLAYER NAME";
        cardFlag.src = `https://flagcdn.com{countryInput.value}.png`;
        
        cardAgg.textContent = aggInput.value;
        aggVal.textContent = aggInput.value;
        
        cardCtr.textContent = ctrInput.value;
        ctrVal.textContent = ctrInput.value;
        
        cardSel.textContent = selInput.value;
        selVal.textContent = selInput.value;
        
        cardPot.textContent = potInput.value;
        potVal.textContent = potInput.value;
        
        cardSaf.textContent = safInput.value;
        safVal.textContent = safInput.value;
        
        cardTem.textContent = temInput.value;
        temVal.textContent = temInput.value;

        // Visual tier theme and dynamic shadow glow adjustment
        if (tierInput.value === 'gold') {
            cardElement.style.background = 'var(--fc-gold-base)';
            cardElement.style.boxShadow = '0 30px 60px rgba(0,0,0,0.8), var(--gold-glow)';
            document.querySelectorAll('input[type="range"]').forEach(el => el.style.accentColor = '#dca021');
        } else if (tierInput.value === 'silver') {
            cardElement.style.background = 'var(--fc-silver-base)';
            cardElement.style.boxShadow = '0 30px 60px rgba(0,0,0,0.8), var(--silver-glow)';
            document.querySelectorAll('input[type="range"]').forEach(el => el.style.accentColor = '#64748b');
        } else if (tierInput.value === 'bronze') {
            cardElement.style.background = 'var(--fc-bronze-base)';
            cardElement.style.boxShadow = '0 30px 60px rgba(0,0,0,0.8), var(--bronze-glow)';
            document.querySelectorAll('input[type="range"]').forEach(el => el.style.accentColor = '#b45309');
        }

        updateOverall();
    }

    // --- SNAPSHOT DEPLOYMENT EXPORTER ---
    function generateBakedCode() {
        const stylesBlock = document.getElementsByTagName('style')[0].outerHTML;
        const scriptsBlock = document.getElementsByTagName('script')[0].outerHTML;
        const activeAvatarGraphic = avatarContainer.innerHTML.trim();
        
        const bakedHtmlPage = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cueverse Player Card Showcase</title>
    ${stylesBlock}
</head>
<body>
<div class="container">
    <div class="card-container">
        <div class="fut-card" id="cardElement" style="background: ${cardElement.style.background}; box-shadow: ${cardElement.style.boxShadow};">
            <div class="card-inner">
                <div class="card-top">
                    <div class="badge-ovr">
                        <span class="ovr-txt">${cardOvr.textContent}</span>
                        <span class="pos-txt">CUE</span>
                        <img src="${cardFlag.src}" class="flag-img">
                        <svg class="club-icon" viewBox="0 0 100 100" xmlns="http://w3.org"><circle cx="50" cy="50" r="45" fill="#000"/><circle cx="50" cy="50" r="20" fill="#fff"/></svg>
                    </div>
                    <div class="avatar-placeholder" id="avatarPlaceholder">${activeAvatarGraphic}</div>
                </div>
                <div class="player-name">${cardName.textContent}</div>
                <div class="stats-grid">
                    <div class="stat-item"><span class="stat-label">AGG</span><span class="stat-val">${cardAgg.textContent}</span></div>
                    <div class="stat-item"><span class="stat-label">CTR</span><span class="stat-val">${cardCtr.textContent}</span></div>
                    <div class="stat-item"><span class="stat-label">SEL</span><span class="stat-val">${cardSel.textContent}</span></div>
                    <div class="stat-item"><span class="stat-label">POT</span><span class="stat-val">${cardPot.textContent}</span></div>
                    <div class="stat-item"><span class="stat-label">SAF</span><span class="stat-val">${cardSaf.textContent}</span></div>
                    <div class="stat-item"><span class="stat-label">TEM</span><span class="stat-val">${cardTem.textContent}</span></div>
                </div>
            </div>
        </div>
    </div>
    <div class="controls-panel" id="adminPanel" style="display: none;">
        ${adminPanel.innerHTML}
    </div>
</div>
${scriptsBlock}
</body>
</html>`;

        document.getElementById('codeBox').value = bakedHtmlPage;
        document.getElementById('outputArea').style.display = 'block';
        document.getElementById('codeBox').select();
    }

    // Input monitoring tracking listeners
    nameInput.addEventListener('input', updateCard);
    countryInput.addEventListener('change', updateCard);
    tierInput.addEventListener('change', updateCard);
    aggInput.addEventListener('input', updateCard);
    ctrInput.addEventListener('input', updateCard);
    selInput.addEventListener('input', updateCard);
    potInput.addEventListener('input', updateCard);
    safInput.addEventListener('input', updateCard);
    temInput.addEventListener('input', updateCard);

    // Initial page load triggers
    checkUrlPermissions();
    updateCard();
</script>

</body>
</html>
